[package]
name = "xdialog-winit-host-example"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone package (not a workspace member, like tests/headless): hosts xdialog inside a
# winit 0.29 event loop, with xdialog built WITHOUT its own winit (default-features = false).
# `cargo tree` of this package must contain no winit 0.30.
[workspace]

[features]
# Self-test extras: pointer clicks at live button rects and PrintWindow captures, through xdialog's
# hidden test hooks (adds no winit).
test-hooks = ["xdialog/_test-hooks"]

[dependencies]
xdialog = { path = "../..", default-features = false, features = ["winit-host"] }
raw-window-handle = "0.6"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
winit029 = { package = "winit", version = "=0.29.15", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

# Only for the self-test's foreground-window check (already in winit 0.29's tree).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }

# Protocol test on a real winit 0.29 loop. One process-wide `init_winit_host`, so no libtest harness.
[[test]]
name = "host"
harness = false
