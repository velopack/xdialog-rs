[package]
name = "xdialog"
version = "4.0.0"
edition = "2021"
license = "MIT"
description = "A small cross-platform native dialogs library."
authors = ["Caelan Sayler <git@caesay.com>"]
repository = "https://github.com/velopack/xdialog"
keywords = ["dialog", "message-box", "messagebox", "cross-platform"]
categories = ["graphics", "gui", "visualization"]
rust-version = "1.95"

[features]
default = []
# `init_win32_direct()` (Windows): Win32 TaskDialog without an XDialogBuilder.
win32-direct = []
# `init_maccf_direct()` (macOS).
maccf-direct = ["dep:core-foundation", "dep:core-foundation-sys"]
# `XDialogBuilder::into_host_app` + `xdialog::host` (incl. `xdialog::host::winit`, a re-export of the
# winit 0.30 xdialog uses): run xdialog's dialogs inside an event loop your application owns.
# Purely additive: it only exposes API; nothing changes for XDialogBuilder::run.
winit-host = []

# ---- private (underscore = not part of the public contract) ----
# Offscreen renderer (`xdialog::__test`) and `XDialogApp::test_*` (doc(hidden)).
_test-hooks = []

[dependencies]
log = "0.4"
thiserror = "2.0"
# egui backends (all platforms). winit's / softbuffer's default features are what Linux needs
# (x11, wayland, rwh_06); their platform deps are target-gated inside those crates, so one entry
# each serves every OS.
egui = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false }
winit = "0.30.13"
softbuffer = "0.4.8"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
unicode-bidi = "0.3.18"
strength_reduce = "0.2.4"
ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }

# AppKit Backend
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSDictionary", "NSGeometry", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageCell",
    "NSImageView",
    "NSParagraphStyle",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSStringDrawing",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = { version = "0.8", optional = true }

# Linux: system fonts and the XDG desktop portal (appearance)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
fontdb = "0.24"

# Win32 Backend
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_Globalization",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }

[[example]]
name = "win32_direct"
required-features = ["win32-direct"]

[[example]]
name = "maccf_direct"
required-features = ["maccf-direct"]

[[example]]
name = "winit_host"
required-features = ["winit-host"]

[[example]]
name = "egui_gallery"
path = "examples/egui_gallery/main.rs"
required-features = ["_test-hooks"]

[[test]]
name = "headless"
harness = false

[[test]]
name = "lifecycle"
harness = false

[[test]]
name = "visual_regression"
harness = false

[[test]]
name = "egui_offscreen"
required-features = ["_test-hooks"]

[[test]]
name = "winit_host"
harness = false
required-features = ["winit-host", "_test-hooks"]

[[bench]]
name = "render"
harness = false
required-features = ["_test-hooks"]

[dev-dependencies]
image = "=0.25.10"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Window captures for tests/visual_regression.rs (Windows uses GDI directly, Wayland `grim`).
[target.'cfg(target_os = "macos")'.dev-dependencies]
xcap = "=0.9.8"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13.2"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[package.metadata.docs.rs]
features = ["winit-host", "win32-direct", "maccf-direct"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]
