[package]
name = "xdialog"
version = "4.0.0"
edition = "2021"
license = "MIT"
description = "A small cross-platform native dialogs library."
authors = ["Caelan Sayler <git@caesay.com>"]
repository = "https://github.com/velopack/xdialog"
keywords = ["dialog", "message-box", "messagebox", "cross-platform"]
categories = ["graphics", "gui", "visualization"]

[features]
default = ["builtin-winit"]
win32-direct = []
maccf-direct = ["dep:core-foundation", "dep:core-foundation-sys"]

# xdialog may own a winit 0.30 event loop: the Linux XDialogBuilder backend, `linux-direct`, and
# `egui-fluent`. Turn default features off (and enable `winit-host`) to build xdialog with no winit.
# Cargo features can't be per-target and a renamed second `winit` dependency is rejected ("depends
# on crate winit multiple times with different names"), so on Windows this also compiles winit
# (never used, nothing linked from it, unless `egui-fluent` / `egui-ubuntu` is on).
builtin-winit = ["dep:winit"]
# Windows: XDialogBuilder uses the Fluent (WinUI 3 look) egui backend instead of Win32 TaskDialog.
# Linux: compiles the fluent theme too (dev only; selectable via XDIALOG_BACKEND=fluent). macOS: no-op.
# NOT additive in behaviour: any crate in the graph enabling it switches the Windows builder backend.
egui-fluent = ["builtin-winit", "_egui", "_fluent-theme"]
# Compiles the Linux (egui) theme + own winit loop on Windows for development/testing.
# On Linux this is always on (no-op). Does NOT change the Windows default (use XDIALOG_BACKEND=ubuntu).
egui-ubuntu = ["builtin-winit", "_egui", "_ubuntu-theme"]
# `init_linux_direct()`: xdialog owns a persistent UI thread with its own winit 0.30 loop,
# started lazily on the first dialog request.
linux-direct = ["egui-ubuntu"]
# `xdialog::host` + `init_winit_host()`: integrate into the host application's own event loop
# (any winit >= 0.29 via raw-window-handle 0.6, or no winit at all). Never uses xdialog's winit.
# With `default-features = false` winit is not compiled at all (the "turn off built-in winit" mode).
winit-host = ["_egui", "_ubuntu-theme"]

# ---- private (underscore = not part of the public contract) ----
_egui = ["dep:egui", "dep:softbuffer", "dep:strength_reduce", "dep:skrifa", "dep:unicode-bidi", "dep:ahash"]
_ubuntu-theme = ["_egui"]
_fluent-theme = ["_egui"]
# Offscreen renderer, live input injection and introspection (`xdialog::__test`, doc(hidden)).
# Implies the Ubuntu theme so that `--features _test-hooks` alone has a concrete Theme (no dead code).
_test-hooks = ["_egui", "_ubuntu-theme"]

[dependencies]
log = "0.4"
oneshot = { version = "0.2", features = ["std"] }
thiserror = "2.0"
# Public dependency of `xdialog::host` (feature `winit-host`). Pure Rust, no dependencies; kept
# non-optional so the macOS `host` stub and the Linux/Windows egui backends share one declaration.
raw-window-handle = "0.6.2"

# AppKit Backend
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDate",
    "NSRunLoop",
    "NSObject",
    "NSDictionary",
    "NSAttributedString",
    "NSGeometry",
    "NSValue",
    "NSArray",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSTextField",
    "NSButton",
    "NSImageView",
    "NSImage",
    "NSProgressIndicator",
    "NSFont",
    "NSColor",
    "NSScreen",
    "NSEvent",
    "NSControl",
    "NSResponder",
    "NSCell",
    "NSButtonCell",
    "NSRunningApplication",
    "NSGraphics",
    "NSText",
    "NSPanel",
] }
block2 = "0.6"
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = { version = "0.8", optional = true }

# Linux: egui backend (always compiled on Linux)
[target.'cfg(target_os = "linux")'.dependencies]
egui = { version = "0.36.2", default-features = false }
softbuffer = "0.4.8"
winit = { version = "0.30.13", optional = true }
zbus = "5"
fontdb = "0.24"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
unicode-bidi = "0.3.18"
strength_reduce = "0.2.4"
ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }

# Win32 Backend (+ optional egui backends: `egui-fluent`, `egui-ubuntu`, `linux-direct`, `winit-host`)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System",
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
] }
widestring = "1.2"
egui = { version = "0.36.2", default-features = false, optional = true }
softbuffer = { version = "0.4.8", default-features = false, optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"], optional = true }
skrifa = { version = "0.44.0", default-features = false, features = ["std"], optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
strength_reduce = { version = "0.2.4", optional = true }
ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"], optional = true }

[[example]]
name = "win32_direct"
required-features = ["win32-direct"]

[[example]]
name = "maccf_direct"
required-features = ["maccf-direct"]

[[example]]
name = "linux_direct"
required-features = ["linux-direct"]

[[example]]
name = "egui_gallery"
path = "examples/egui_gallery/main.rs"
required-features = ["_test-hooks", "egui-fluent", "egui-ubuntu"]

[[test]]
name = "macos_ui"
harness = false

[[test]]
name = "visual_regression"
harness = false

[[test]]
name = "egui_offscreen"
required-features = ["_test-hooks", "egui-ubuntu"]

[[test]]
name = "egui_direct"
required-features = ["linux-direct"]

[[test]]
name = "egui_direct_recreate"
harness = false
required-features = ["linux-direct"]

[[bench]]
name = "render"
harness = false
required-features = ["_test-hooks", "egui-ubuntu"]

[dev-dependencies]
ntest = "=0.9.5"
image = "=0.25.10"
xcap = "=0.9.8"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[package.metadata.docs.rs]
features = ["linux-direct", "winit-host"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]
