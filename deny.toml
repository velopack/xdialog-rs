[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # ttf-parser unmaintained. Transitive only, Linux/BSD only: winit 0.30 -> sctk-adwaita ->
    # ab_glyph -> owned_ttf_parser (the Wayland client-side decorations), and cosmic-text ->
    # fontdb (the system font scan of the software renderer). xdialog's own glyph code uses
    # skrifa. No replacement upstream yet.
    "RUSTSEC-2026-0192",
]

[licenses]
# Reviewed for the drawing layer (4.0): vello_cpu, vello_common, glifo, peniko, kurbo,
# fearless_simd (Apache-2.0 OR MIT), cosmic-text, skrifa, read-fonts, sys-locale (MIT OR
# Apache-2.0), fontdb, harfrust (MIT), unicode-linebreak (Apache-2.0), self_cell (Apache-2.0 OR
# GPL-2.0-only, taken as Apache-2.0), accesskit 0.25, objc2-core-* 0.3 and windows-numerics: all
# covered below, no exceptions. The bundled Ubuntu fonts (src/backends/draw/soft/fonts/, Linux/BSD
# builds only) are under the Ubuntu Font Licence 1.0 (its text ships next to them, LICENCE.txt), which
# cargo-deny doesn't see.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
