[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained (dev-only: xcap -> image -> rav1e)
    # ttf-parser unmaintained. Transitive only: winit 0.30 -> sctk-adwaita -> ab_glyph ->
    # owned_ttf_parser (the Wayland client-side decorations; Linux).
    # xdialog itself parses fonts with skrifa (via egui/epaint). No replacement upstream yet.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
