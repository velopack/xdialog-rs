name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Windows test windows never take focus and open off every monitor (honoured by test builds).
  XDIALOG_TEST_NO_ACTIVATE: "1"
  XDIALOG_TEST_POS: offscreen

jobs:
  # On every OS: clippy and every test, with the default and with all features.
  #   default        XDialogBuilder, backend chosen at runtime (Auto: Fluent/Win32, Ubuntu, AppKit)
  #   all features   + winit-host (xdialog::host), win32-direct / maccf-direct, and _test-hooks:
  #                  the offscreen goldens of the drawn looks (tests/offscreen.rs) through this
  #                  OS's renderer (d2d on Windows, cg on macOS, soft elsewhere) and the host test
  #                  (tests/winit_host.rs)
  # The soft goldens are always compared; d2d/cg ones only when offscreen/<renderer>/FONT_ID
  # matches the runner's fonts and OS version. Renders that were skipped or differ are uploaded
  # from target/offscreen-actual/.
  # Windows and macOS also check that the software stack isn't compiled there (bloat guard) and
  # print the release size of an example. Linux also runs the doc tests and rustdoc.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-latest, name: Linux }
          - { os: macos-latest, name: macOS }

    steps:
      - uses: actions/checkout@v7

      # Xvfb and the X11 libraries winit loads at runtime (the build needs no -dev packages).
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Clippy
        shell: bash # fails on the first failing command (pwsh would only check the last)
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings

      # Windows (Direct2D) and macOS (CoreGraphics) must never compile the software renderer, its
      # text stack or the bundled fonts, not even for tests, benches or examples (-e all); Windows
      # doesn't compile softbuffer either. The Linux tree is the control: it must list them, so a
      # change in cargo tree's output can't make the guard pass vacuously.
      - name: Bloat guard
        if: runner.os != 'Linux'
        shell: bash
        run: |
          crates() { cargo tree --locked --all-features -e all --target "$1" --prefix none -f '{p}' | cut -d' ' -f1 | sort -u; }
          soft="vello_cpu vello_common glifo cosmic-text skrifa fontdb harfrust sys-locale egui epaint"
          linux=$(crates x86_64-unknown-linux-gnu)
          for c in vello_cpu cosmic-text skrifa; do
            grep -qx "$c" <<<"$linux" || { echo "control failed: $c not in the Linux tree"; exit 1; }
          done
          fail=0
          check() {
            have=$(crates "$1")
            for c in $2; do
              if grep -qx "$c" <<<"$have"; then
                echo "::error::$c leaked into $1"
                cargo tree --locked --all-features -e all --target "$1" -i "$c" || true
                fail=1
              fi
            done
          }
          check x86_64-pc-windows-msvc "$soft softbuffer"
          check aarch64-apple-darwin "$soft"
          exit $fail

      - name: Start virtual display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Test
        shell: bash
        run: |
          cargo test --locked --lib --tests
          cargo test --locked --lib --tests --all-features

      - name: Upload offscreen renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offscreen-actual-${{ matrix.name }}
          path: target/offscreen-actual/
          if-no-files-found: ignore

      - name: Release size
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --locked --release --example various_options
          bin=target/release/examples/various_options
          [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "$bin: $size bytes"
          echo "Release size of \`various_options\` (${{ matrix.name }}): $size bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Doc tests and rustdoc (no warnings)
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --doc --features winit-host
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --features winit-host

  # Linux without a display server: every dialog function returns NoBackendAvailable and the
  # program keeps running. The static (musl) test binary is built once, then run on a range of old
  # and new distributions.
  headless-build:
    name: Headless Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: headless

      - name: Build and run the headless test
        run: |
          cargo test --locked --release --target x86_64-unknown-linux-musl --test headless
          bin=$(cargo test --locked --release --target x86_64-unknown-linux-musl --test headless --no-run --message-format=json \
                | jq -r 'select(.profile.test == true and .target.name == "headless") | .executable')
          cp "$bin" xdialog-headless-test

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: headless-binary
          path: xdialog-headless-test

  headless:
    name: Headless (${{ matrix.distro }})
    needs: headless-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:12.04
          - ubuntu:18.04
          - ubuntu:24.04
          - debian:7
          - debian:bookworm-slim
          - alpine:3.3
          - alpine:3.20
          - centos:6
          - centos:7
          - fedora:21
          - fedora:41
          - gcr.io/distroless/static-debian12
    steps:
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: headless-binary

      - name: Run in container
        run: |
          chmod +x xdialog-headless-test
          docker run --rm \
            -v $PWD/xdialog-headless-test:/xdialog-headless-test \
            ${{ matrix.distro }} \
            /xdialog-headless-test

  # On-screen captures vs tests/visual_references/<platform>/: the native backends (Win32
  # TaskDialog: the test forces it; AppKit) and the Linux default, the drawn Ubuntu look (software
  # renderer), on X11 (Xvfb + openbox) and Wayland (headless sway, captured with grim). The drawn
  # looks also have offscreen goldens (build job).
  visual-regression:
    name: Visual Regression (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows

          - os: macos-26
            name: macOS

          - os: ubuntu-latest
            name: Linux

          - os: ubuntu-latest
            name: Linux Wayland
            wayland: true

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-regression-${{ matrix.name }}

      - name: Start virtual display (X11)
        if: runner.os == 'Linux' && !matrix.wayland
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          DISPLAY=:99 openbox &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV
          # Verify the window manager is running
          DISPLAY=:99 xprop -root _NET_CLIENT_LIST_STACKING || echo "Warning: WM may not be ready"

      - name: Start virtual display (Wayland)
        if: matrix.wayland
        run: |
          sudo apt-get update
          sudo apt-get install -y sway grim
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/wayland-runtime}"
          mkdir -p "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> $GITHUB_ENV
          # Minimal sway config for headless mode
          mkdir -p /tmp/sway-config
          cat > /tmp/sway-config/config << 'SWAYCFG'
          output HEADLESS-1 resolution 500x500
          SWAYCFG
          # Start sway with the headless wlroots backend (supports wlr-screencopy for grim)
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 sway -c /tmp/sway-config/config &
          sleep 3
          # Find the socket sway created
          SOCKET=$(ls "$XDG_RUNTIME_DIR"/wayland-* 2>/dev/null | grep -v '\.lock$' | head -1 | xargs basename)
          echo "Found Wayland socket: $SOCKET"
          echo "WAYLAND_DISPLAY=$SOCKET" >> $GITHUB_ENV

      - name: Run visual regression tests
        env:
          XDIALOG_VISUAL_TEST: "1"
          # The visual test positions its windows itself (the TaskDialog path captures the screen).
          XDIALOG_TEST_POS: ""
        run: cargo test --locked --test visual_regression

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-output-${{ matrix.name }}
          path: target/tmp/visual_output/

  # Rendering performance: one offscreen frame per case (static, hover fade, indeterminate
  # progress, 2x HiDPI, construction) for each drawn look, on the Linux software renderer.
  render-bench:
    name: Render Bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: render-bench

      - name: Run benchmark
        run: cargo bench --locked --bench render --features _test-hooks -- --quick

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Check advisories, bans, licenses and sources
        run: cargo deny --locked --all-features check
